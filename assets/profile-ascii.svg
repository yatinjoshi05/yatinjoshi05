    </g>
    <g class="ascii-row" style="animation-delay: 1.090s">
      <text x="20" y="230.8" class="ascii-text" xml:space="preserve">                      `:-+s%@@@@@@%##s*++====*s#%#s-                </text>
    </g>
    <g class="ascii-row" style="animation-delay: 1.130s">
      <text x="20" y="237.6" class="ascii-text" xml:space="preserve">                  =c#@@=-=+*s%@@@@%%%%%######%%%%#s-                </text>
    </g>
    <g class="ascii-row" style="animation-delay: 1.170s">
      <text x="20" y="244.4" class="ascii-text" xml:space="preserve">                .c%@@#+:-=++**cs#%@@@@@@@@@@@%#c--@@s:              </text>
    </g>
    <g class="ascii-row" style="animation-delay: 1.210s">
      <text x="20" y="251.2" class="ascii-text" xml:space="preserve">             :=+s##%s=---==+++++**css###sssc+=-:`:%%##+`            </text>
    </g>
    <g class="ascii-row" style="animation-delay: 1.250s">
      <text x="20" y="258.0" class="ascii-text" xml:space="preserve">        .:=*s#####%%#*+---==++++++******+=--::::``c@%##sc+:.        </text>
    </g>
    <g class="ascii-row" style="animation-delay: 1.290s">
      <text x="20" y="264.8" class="ascii-text" xml:space="preserve">    .:+s%%%%#####%%%%%s+====+++++++***++=-:::::``:s@%##s####sc+=`   </text>
    </g>
    <g class="ascii-row" style="animation-delay: 1.330s">
      <text x="20" y="271.6" class="ascii-text" xml:space="preserve"> :*cs%@@%#%%##%%%%%%%%%#c*+***++++**++==-:::::::-+%@%#s#####%##%%#c=</text>
    </g>
    <g class="ascii-row" style="animation-delay: 1.370s">
      <text x="20" y="278.4" class="ascii-text" xml:space="preserve"> =##%%%%#%@%%%###%%%%%%%%#sc*c**+++++===--------*#%%#####%@#%%#s#%%#</text>
    </g>
    <g class="ascii-row" style="animation-delay: 1.410s">
      <text x="20" y="285.2" class="ascii-text" xml:space="preserve"> =%%%%%##%%%%%%%#%%%%%%%%%%#*+=+++===-----::::-c#%%#####%%%%#%%#s#%s</text>
    </g>
    <g class="ascii-row" style="animation-delay: 1.450s">
      <text x="20" y="292.0" class="ascii-text" xml:space="preserve"> +@%%%%#%%%%%%@%%%#%%%%%%%%%%s*-:::::::``:``:+s%%#######%%%###%%##%s</text>
    </g>
    <g class="ascii-row" style="animation-delay: 1.490s">
      <text x="20" y="298.8" class="ascii-text" xml:space="preserve"> +@#%%#%%%%%%%@@@@@@@@@@@@@@@%%#*-``````::-+#%%#%%%@@@%%@%%####%%%#s</text>
    </g>
    <g class="ascii-row" style="animation-delay: 1.530s">
      <text x="20" y="305.6" class="ascii-text" xml:space="preserve"> +%%%%#%%%%%%%%%%%@@@@@@@@@@@@@@@%s+:``::+s%%%@%%@@@%@%%%%######%%%s</text>
    </g>
    <g class="ascii-row" style="animation-delay: 1.570s">
      <text x="20" y="312.4" class="ascii-text" xml:space="preserve"> +@%%#%%%%####%%%%%%%%%%%@@@@@@@@@@@%c+=c%@%@@@%%%%%%%%%#########%@#</text>
    </g>
    <g class="ascii-row" style="animation-delay: 1.610s">
      <text x="20" y="319.2" class="ascii-text" xml:space="preserve"> +@%#%%%%####%###%%%%%%%%%%%%%%%%@@@@@@#%%%@@%%%%%%%%#%###########%#</text>
    </g>
    <g class="ascii-row" style="animation-delay: 1.650s">
      <text x="20" y="326.0" class="ascii-text" xml:space="preserve"> *@##%%%##########%%%%%%%%%%%%%%%%%%%%##%%%%%%%%%%%##%%############s</text>
    </g>
    <g class="ascii-row" style="animation-delay: 1.690s">
      <text x="20" y="332.8" class="ascii-text" xml:space="preserve"> +%#%%####################%%%%%%%%%%@%c*#%%%%#%%%##################s</text>
    </g>
    <g class="ascii-row" style="animation-delay: 1.730s">
      <text x="20" y="339.6" class="ascii-text" xml:space="preserve"> *@%%%@@@%%%%%%%%%%%%%%%%%%@@@@@@@@@@@@@%%%@@@@@%%%%%%%%%%%%%%%%%%%s</text>
    </g>
    <g class="ascii-row" style="animation-delay: 1.770s">
      <text x="20" y="346.4" class="ascii-text" xml:space="preserve"> `=--------------------------------==------------------------------:</text>
    </g>
  </g>
</svg>
